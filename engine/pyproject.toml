[project]
name = "dcsim"
version = "0.6.0"  # keep equal to dcsim.config.ENGINE_VERSION (tests/test_engine.py checks)
description = "DC What-If simulation engine (SimPy) for a UMass dining common"
requires-python = ">=3.13"
dependencies = [
    "simpy>=4.1",
    "numpy>=2.1",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "groq>=1.7.0",
    "google-genai>=3.3.0",
    "psycopg[binary]>=3.2",
]

[project.scripts]
dcsim = "dcsim.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
